name: Learn competitions

# Accumulate which channels air live matches of which competition, from the EPG.
# Daily is enough: the guides reach ~36h ahead, so each day's matches are seen at
# least once. Reads only our own /api/epg and /api/playlist (no stream slot, no
# provider creds). Jev (TypeSafe) judges each new match-like title once; its verdicts
# persist in the Actions cache, so a day only pays for titles it hasn't seen.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch the deploy after committing

concurrency:
  group: learn-competitions
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: this job holds the box's root SSH key.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Cloudflare challenges runner IPs at iptv.mohamed3on.com, so reach the box's
      # endpoints over SSH instead (the deploy key, see deploy.yml).
      - name: Tunnel to the box
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 65.108.153.112 >> ~/.ssh/known_hosts
          ssh -fN -o ExitOnForwardFailure=yes -L 8790:127.0.0.1:8790 root@65.108.153.112

      # Cache entries are immutable: each run saves a new one and restores the latest.
      - name: Restore Jev verdicts
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: jev-${{ github.run_id }}
          restore-keys: jev-

      - name: Learn from the EPG
        env:
          PLAYLIST_TOKEN: ${{ secrets.PLAYLIST_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EPG_ENDPOINT: http://127.0.0.1:8790/api/epg
        run: bun scripts/learn-competitions.ts

      - name: Save Jev verdicts
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: jev-${{ github.run_id }}

      - name: Commit refreshed cache if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- api/competition-cache.ts; then
            echo "No competition changes this run."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add api/competition-cache.ts
            git commit -m "chore: learn competition channels from the EPG"
            git push
            # A GITHUB_TOKEN push starts no workflows, so deploy explicitly.
            gh workflow run deploy.yml
          fi
