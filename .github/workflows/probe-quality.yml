name: Probe feed quality

# Nightly re-probe of real feed quality (scripts/probe-quality.ts) via deploy/probe-quality.sh,
# which copies the box's readings, probes, and has the box merge what changed. It runs here
# because the provider refuses streams from the box's IP (HTTP 511). The account has ONE
# connection slot: the probe won't start while someone is watching and stops as soon as
# someone starts, so it runs when nobody watches.
on:
  schedule:
    - cron: '23 2 * * *' # off the hour, when GitHub drops the most scheduled runs
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to probe for (the run holds the single connection slot)'
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: probe-quality
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      # Pinned: this job holds the box's root SSH key.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Probe and merge on the box
        env:
          XTREAM_HOST: ${{ secrets.XTREAM_HOST }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          # Via env, not inline in `run:` — a dispatch input in the shell is an injection seam.
          MINUTES: ${{ inputs.minutes || '30' }}
        run: |
          case "$MINUTES" in
            ''|*[!0-9]*) echo "minutes must be a whole number, got '$MINUTES'"; exit 1 ;;
          esac
          SERVER=root@$HOST ./deploy/probe-quality.sh "$MINUTES"
