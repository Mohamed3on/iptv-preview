<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sofa logo lab</title>
    <style>
      :root { color-scheme: dark; font: 13px/1.4 system-ui, sans-serif; }
      body { margin: 0; background: #07090c; color: #c9d0d8; display: grid; grid-template-columns: 1fr 300px; min-height: 100vh; }
      main { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
      aside { background: #0e1217; border-left: 1px solid #1d242c; padding: 14px; overflow-y: auto; height: 100vh; box-sizing: border-box; position: sticky; top: 0; scrollbar-width: thin; scrollbar-color: #2c3744 transparent; }
      .tabs { display: flex; gap: 6px; }
      .tabs button, .bar button { background: #161c23; color: #c9d0d8; border: 1px solid #262f39; border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; }
      .tabs button[aria-pressed='true'] { background: #3d9bff; border-color: #3d9bff; color: #06121f; font-weight: 600; }
      button:focus-visible { outline: 2px solid #3d9bff; outline-offset: 2px; }
      .stage { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
      .stage > div { cursor: pointer; line-height: 0; }
      .icon { border-radius: 22%; overflow: hidden; }
      .real { display: flex; gap: 24px; align-items: center; padding: 24px; background: #0b0e12; border-radius: 12px; flex-wrap: wrap; }
      .real figure { margin: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; font-size: 11px; color: #8790a0; }
      .card { border-radius: 10px; overflow: hidden; line-height: 0; }
      .focused { transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 10px 30px #000a; margin: 0 14px; }
      .firetile { width: 320px; height: 180px; background: #3a4048; border-radius: 6px; display: grid; place-items: center; }
      .firetile .icon { width: 108px; height: 108px; }
      .bar { display: flex; gap: 10px; align-items: center; color: #8790a0; }
      .seed { font-variant-numeric: tabular-nums; color: #f4f6f8; }
      .rail { display: flex; gap: 10px; flex-wrap: wrap; }
      .rail div { cursor: pointer; line-height: 0; border-radius: 6px; overflow: hidden; outline: 1px solid #262f39; }
      .rail div:hover { outline-color: #3d9bff; }
      label { display: grid; grid-template-columns: 92px 1fr 44px; gap: 8px; align-items: center; padding: 3px 0; }
      label input[type='range'] { width: 100%; accent-color: #3d9bff; }
      label output { text-align: right; font-variant-numeric: tabular-nums; color: #f4f6f8; }
      h3 { margin: 14px 0 4px; font-size: 12px; color: #f4f6f8; }
      .hint { color: #8790a0; }
    </style>
  </head>
  <body>
    <main>
      <div class="tabs" id="tabs"></div>
      <div class="stage"><div id="banner" title="Click for a new one"></div><div id="icon" class="icon" title="Click for a new one"></div></div>
      <div class="real" id="real"></div>
      <div class="bar"><span>seed <span class="seed" id="seed"></span></span><button id="save">Save</button><span id="saved"></span></div>
      <div class="hint">Click the banner or icon for a new one · knobs to tweak · Save to keep</div>
      <div class="rail" id="rail"></div>
    </main>
    <aside id="panel"></aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
